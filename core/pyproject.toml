[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchlight-core"
version = "0.3.0"
description = "Torchlight unified core library — shared tools, API, memory, and error handling"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

dependencies = [
    "httpx>=0.24",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
llm = [
    "tiktoken>=0.5",
]
memory = [
    "psutil>=5.9",
]
cloud = [
    "openai>=1.0",
]
ollama = [
    "ollama>=0.1",
]
treesitter = [
    "tree-sitter>=0.21.0",
]
web = [
    "playwright>=1.60.0",
]
all = [
    "torchlight-core[llm,memory,cloud,ollama,treesitter,web]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["core*"]
